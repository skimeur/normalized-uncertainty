name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Public-safety gate
        run: python scripts/check_public_safe.py

      - name: Lint
        run: python -m ruff check .

      - name: Unit tests
        run: python -m pytest

# No exhibit is rebuilt here: this repository distributes no data, and the
# runner has none. The exhibits are rebuilt locally against the sources of
# data/README.md, and the reproduction gates run there.
